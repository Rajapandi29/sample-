<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>API Login Lab</title><link rel="stylesheet" href="/styles.css"></head><body><main>
<section id="auth-view" class="card auth"><p class="eyebrow">REAL API PRACTICE</p><h1>API Login Lab</h1><p class="muted">Register, login, and watch each API call live.</p><div class="tabs"><button class="tab active" data-mode="login">Login</button><button class="tab" data-mode="register">Register</button></div><form id="auth-form"><label id="name-wrap" hidden>Name<input id="name" placeholder="Your name"></label><label>Email<input id="email" type="email" placeholder="you@example.com" required></label><label>Password<input id="password" type="password" placeholder="Minimum 6 characters" required></label><button id="auth-button">Login with POST API</button></form><p id="message"></p></section>
<section id="app-view" hidden><header><div><p class="eyebrow">AUTHENTICATED APP</p><h1>Welcome, <span id="user-name"></span></h1></div><button id="logout" class="outline">Logout</button></header><div class="grid"><section class="card"><h2>My tasks</h2><form id="task-form"><input id="task-title" placeholder="Add a task" required><button>Add</button></form><ul id="tasks"></ul></section><section class="card"><h2>Live API requests</h2><p class="muted">Every action below calls these APIs.</p><div id="requests" class="requests"></div></section></div></section>
</main><script src="/app.js"></script></body></html>
